<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTM Depth · טיימליין</title>
<style>
@font-face{font-family:S;font-weight:900;src:url(__FONTS__%2FSYSTMDisplayV2-Black.ttf)}
@font-face{font-family:S;font-weight:700;src:url(__FONTS__%2FSYSTMDisplayV2-Bold.woff2)}
@font-face{font-family:S;font-weight:500;src:url(__FONTS__%2FSYSTMDisplayV2-Medium.woff2)}
:root{--carbon:#080c0e;--panel:#0f1518;--line:#1d272c;--paper:#f5f7f7;--mute:#7d8a8f;--ice:#acf4f8}
*{box-sizing:border-box}
body{margin:0;background:var(--carbon);color:var(--paper);font-family:S,system-ui,sans-serif;font-weight:500}
header{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line)}
header h1{font-weight:900;font-size:22px;margin:0;letter-spacing:-.01em}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--ice);box-shadow:0 0 12px var(--ice)}
header .sub{color:var(--mute);font-size:14px}
.proj{padding:22px 28px 30px;border-bottom:1px solid var(--line)}
.top{display:flex;gap:22px;align-items:flex-start}
.meta h2{font-weight:900;font-size:20px;margin:0 0 6px}
.meta .k{color:var(--mute);font-size:13px}
.passes{display:grid;grid-template-columns:auto 220px auto;gap:6px 10px;align-items:center;margin-top:14px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ice);transition:width .6s}
.pv{display:flex;gap:14px;margin-inline-start:auto}
.pv img,.pv video{height:300px;border-radius:10px;border:1px solid var(--line);background:#000}
.pv figure{margin:0;text-align:center;font-size:12px;color:var(--mute)}
.tl{margin-top:20px;direction:ltr;overflow-x:auto;padding-bottom:6px}
.ruler,.track{position:relative;height:20px}
.ruler span{position:absolute;top:0;font-size:11px;color:var(--mute);border-left:1px solid var(--line);padding-left:3px;height:100%}
.beats{position:relative;height:250px}
.beat{position:absolute;top:0;height:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#111 center/cover no-repeat;cursor:pointer}
.beat:hover{border-color:var(--ice)}
.beat .hero{position:absolute;left:50%;top:26%;transform:translateX(-50%);max-width:80%;max-height:42%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.beat .fgl{position:absolute;top:0;height:100%;opacity:.85}
.beat .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,14,.75) 0,rgba(8,12,14,0) 30%,rgba(8,12,14,0) 62%,rgba(8,12,14,.9) 100%)}
.beat .t{position:absolute;top:8px;left:6px;right:6px;direction:rtl;text-align:center;font-weight:900;font-size:15px;line-height:1.1}
.beat .t b{color:var(--ice);font-weight:900}
.beat .info{position:absolute;bottom:6px;left:6px;right:6px;font-size:10.5px;color:#cfd8da;display:flex;flex-wrap:wrap;gap:3px}
.chip{background:rgba(255,255,255,.08);border-radius:4px;padding:1px 5px;white-space:nowrap}
.chip.ice{background:rgba(172,244,248,.16);color:var(--ice)}
.id{position:absolute;top:-1px;left:-1px;background:var(--carbon);font-size:10px;padding:2px 6px;border-radius:0 0 6px 0;color:var(--mute)}
.tr{position:absolute;top:96px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--carbon);border:1px solid var(--ice);display:grid;place-items:center;z-index:3}
.tr svg{width:14px;height:14px;stroke:var(--ice);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lane-l{font-size:11px;color:var(--mute);margin:8px 0 2px}
.words{position:relative;height:36px;border-top:1px solid var(--line)}
.words span{position:absolute;top:3px;font-size:10.5px;color:#aab6ba;white-space:nowrap;direction:rtl}
.sfx{position:relative;height:18px}
.sfx i{position:absolute;top:3px;height:12px;border-radius:3px;background:rgba(172,244,248,.35)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ice);box-shadow:0 0 8px var(--ice);z-index:5;pointer-events:none}
</style>
</head>
<body>
<header><span class="dot"></span><h1>SYSTM Depth</h1><span class="sub">טיימליין של כל הסרטונים בעריכה ובתהליך רינדור · מתעדכן לבד</span></header>
<main id="m"></main>
<script>
const PX = 46; // pixels per second
const ICON = {
  push:'<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg>',
  'whip-left':'<svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6M20 7h-6M20 17h-6"/></svg>',
  'whip-right':'<svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6M4 7h6M4 17h6"/></svg>',
  'whip-up':'<svg viewBox="0 0 24 24"><path d="M12 20V4M6 10l6-6 6 6"/></svg>',
  'whip-down':'<svg viewBox="0 0 24 24"><path d="M12 4v16M6 14l6 6 6-6"/></svg>',
  dive:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
  flash:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>',
  dip:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#acf4f8"/></svg>',
  line:'<svg viewBox="0 0 24 24"><path d="M3 21 21 3"/></svg>',
  cut:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/></svg>'};
ICON.whip = ICON['whip-left'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = (s) => String(s).replace(/[^\p{L}\p{N}]/gu, '');
let open = {};
function title(t){ if(!t) return ''; const ws=(t.text||'').split(/\s+/); return (t.kicker?`<div style="font-size:10px;font-weight:500;opacity:.8">${esc(t.kicker)}</div>`:'')+ws.map(w=>t.accent&&norm(w).includes(norm(t.accent))?`<b>${esc(w)}</b>`:esc(w)).join(' '); }
function render(st){
  const m=document.getElementById('m');
  m.innerHTML = st.map(p=>{
    const W=p.duration*PX, pct=(n)=>p.total?Math.min(100,n/p.total*100):0;
    const ruler=Array.from({length:Math.ceil(p.duration/5)+1},(_,i)=>`<span style="left:${i*5*PX}px">${i*5}s</span>`).join('');
    const beats=p.beats.map(b=>{
      const bg=b.layers.find(l=>l.role==='bg'), hero=b.layers.find(l=>l.role==='hero'||l.role==='card'), mid=b.layers.find(l=>l.role==='mid'), fg=b.layers.find(l=>l.role==='fg');
      const w=(b.end-b.start)*PX-3;
      return `<div class="beat" style="left:${b.start*PX}px;width:${w}px;background-image:${bg?.img?`url('${bg.img}')`:'none'}" title="${esc(b.id)} ${b.start}-${b.end}s">
        ${b.presenter==='full'?'<div style="position:absolute;inset:0;background:rgba(40,30,25,.55)"></div>':''}
        ${mid?.img?`<img class="hero" style="top:34%;opacity:.8" src="${mid.img}">`:''}
        ${hero?.img?`<img class="hero" src="${hero.img}">`:''}
        ${fg?.img?`<img class="fgl" style="${(fg.x||0)>0?'right':'left'}:-10px" src="${fg.img}">`:''}
        <div class="sh"></div><div class="id">${b.id} · ${(b.end-b.start).toFixed(1)}s</div>
        <div class="t">${title(b.title)}</div>
        <div class="info"><span class="chip">${esc(b.camera?.move)}</span><span class="chip ${b.presenter==='bottom'?'':'ice'}">${b.presenter==='bottom'?'דובר':b.presenter==='full'?'דובר מלא':'בלי דובר'}</span>${b.layers.filter(l=>l.role!=='bg').map(l=>`<span class="chip">${esc(l.role)}</span>`).join('')}</div>
      </div>${b.start>0?`<div class="tr" style="left:${b.start*PX}px" title="${esc(b.transition)}">${ICON[b.transition]||ICON.cut}</div>`:''}`;
    }).join('');
    const words=p.words.map((w,i)=>`<span style="left:${w.s*PX}px;top:${i%2?18:3}px">${esc(w.t)}</span>`).join('');
    const sfx=(p.sfx||[]).map(s=>`<i style="left:${s.t*PX}px;width:${Math.max(4,(s.d||0.3)*PX)}px" title="${esc(s.name)}"></i>`).join('');
    const ph=p.total&&p.passes.world<p.total?`<div class="ph" style="left:${p.passes.world/30*PX}px"></div>`:'';
    const vids=p.videos.slice(-1).map(v=>`<figure><video src="${v.url}" controls playsinline></video><figcaption>${esc(v.name)}</figcaption></figure>`).join('');
    return `<section class="proj"><div class="top"><div class="meta"><h2>${esc(p.id)}</h2>
      <div class="k">עולם: ${esc(p.world)} · ${p.duration}s · ${p.beats.length} פעימות · ${p.total} פריימים</div>
      <div class="passes">${Object.entries(p.passes).map(([k,n])=>`<span>${k}</span><div class="bar"><i style="width:${pct(n)}%"></i></div><span>${n}/${p.total}</span>`).join('')}</div></div>
      <div class="pv">${p.last?`<figure><img src="${p.last}"><figcaption>הפריים האחרון שרונדר (world)</figcaption></figure>`:''}${vids}</div></div>
      <div class="tl" data-id="${esc(p.id)}"><div style="width:${W}px;position:relative">
        <div class="ruler">${ruler}</div><div class="beats">${beats}${ph}</div>
        <div class="lane-l" style="direction:rtl">מילים</div><div class="words">${words}</div>
        ${sfx?`<div class="lane-l" style="direction:rtl">SFX</div><div class="sfx">${sfx}</div>`:''}
      </div></div></section>`;
  }).join('') || '<p style="padding:28px">אין עדיין פרויקטים של עומק.</p>';
}
async function tick(){ if([...document.querySelectorAll('video')].some(v=>!v.paused)) return; const sx=[...document.querySelectorAll('.tl')].map(e=>e.scrollLeft); try{ const r=await fetch('/api/state'); render(await r.json()); document.querySelectorAll('.tl').forEach((e,i)=>e.scrollLeft=sx[i]||0); }catch{} }
tick(); setInterval(tick, 8000);
</script>
</body>
</html>
